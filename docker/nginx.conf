server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 101m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location = /healthz {
        access_log off;
        return 200 'ok';
    }
    location /api/ {
        access_log off; # Download tickets must not be recorded in access logs.
        # Resolve the Compose service again when an API container is recreated.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:3001;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control 'public, max-age=31536000, immutable';
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control no-cache;
    }
}
