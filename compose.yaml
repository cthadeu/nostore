name: nostore
x-app-environment: &app-environment
  # Local compose uses HTTP. Deployed environments must set production and HTTPS.
  NODE_ENV: development
  HOST: 0.0.0.0
  PORT: 3001
  APP_ORIGIN: ${DOCKER_APP_ORIGIN:-http://localhost:8080}
  DATABASE_URL: postgresql://nostore:nostore_local@postgres:5432/nostore
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Execute ./scripts/docker-up.sh para gerar a configuração local}
  STORAGE_DIR: /app/storage
  PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-simulated}
  ADMIN_EMAILS: ${ADMIN_EMAILS:-}
  CLAMAV_HOST: clamav
  CLAMAV_PORT: 3310
  SMTP_HOST: mailpit
  SMTP_PORT: 1025
  MAIL_FROM: nostore <no-reply@nostore.local>
services:
  clamav:
    image: clamav/clamav:stable
    volumes: ["clamav_data:/var/lib/clamav"]
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nostore
      POSTGRES_PASSWORD: nostore_local
      POSTGRES_DB: nostore
    ports: ["127.0.0.1:5438:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/10-test.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nostore -d nostore"]
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  migrate:
    build:
      context: .
      target: migrate
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  api:
    build:
      context: .
      target: api
    environment: *app-environment
    volumes: ["assets_data:/app/storage"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/v1/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 12
    init: true
    restart: unless-stopped
  worker:
    build:
      context: .
      target: api
    command: ["node", "src/worker.ts"]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    init: true
    stop_grace_period: 45s
    restart: unless-stopped
  web:
    build:
      context: .
      target: web
    ports: ["127.0.0.1:${WEB_PORT:-8080}:80"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  assets_data:
  clamav_data:
